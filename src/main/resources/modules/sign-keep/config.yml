# TORO-Core の sign-keep モジュール。
# 文字入りの看板 (Ctrl+ピックブロックや /give で作ったもの) を、OP 以外の建築担当にも置けるようにし、
# 置いた直後に編集画面を開かない (Minecraft 26.3 の仕様変更への対策)。
# 空の看板と、置いたあとに右クリックして開く編集画面には何もしない。

# 対象にするプレイヤーの権限ノード。持っているプレイヤーだけが対象になる。
# 既定の torocore.signkeep.use は、既定では誰も持たない。LuckPerms で建築担当のグループに付けるか、
# 建築担当のグループそのものを指す "group.<グループ名>" をここに書く。
permission: torocore.signkeep.use

# true なら OP も対象にする (OP は権限ノードが無くても対象)
include-ops: true

# アイテムが持つ看板データから、サーバーが文字を書く (OP 以外の建築担当向け)。
# 書くのは文字・色・光る文字だけで、クリックイベントなどの実行される要素は取り除く。
write-from-item: true

# 裏面の文字も書く
copy-back-side: true

# 編集画面を止めたとき、文字を書いたときにコンソールへログを出す
log: true

# 対象のプレイヤーのクライアントにだけ OP の権限レベルを伝える (共有部品 fake-op を使う。
# modules の fake-op も true にすること)。サーバー側の権限は変わらない。
# 看板の文字を残すだけなら要らない (Paper は minecraft.nbt.copy / minecraft.nbt.place の権限で足りる) ので、既定は false。
fake-op:
  enabled: false
  # 2 = ゲームマスター。クライアント側の「F3+F4 のゲームモード切替」「クリエイティブのオペレータータブ」を満たす最小値
  level: 2
