# dynmap-live: 地図 (map.torosaba.net) にプレイヤーの動きをすぐ出すため、全員の位置と体力を地図サーバーに送る
# 地図に誰を出すかは dynmap が決める (地図サーバーは dynmap が出しているプレイヤーの位置だけをブラウザに流す)

# 送り先。地図サーバーの WebSocket (例: ws://localhost:3000/live/plugin)。空のときは送らない
endpoint: ''
# 地図サーバーの NUXT_LIVE_TOKEN と同じ値 (空のときは送らない)
token: ''
# 何 tick ごとに送るか (5 tick = 0.25 秒)
interval-ticks: 5
# 誰も動いていなくても、この秒数ごとに送る (つながっているか確かめるため)
heartbeat-seconds: 5
